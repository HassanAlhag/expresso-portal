ke="#e4e2e8"/><text x="42" y="406" font-size="20" fill="#15121f" font-weight="600">Service rollout</text><text x="42" y="433" font-size="15" fill="#6b6776" font-weight="400">Sample organisation</text><rect x="42" y="445" width="104" height="32" rx="8" fill="#e8eaf6" stroke="none"/><text x="54" y="467" font-size="15" fill="#5562a8" font-weight="600">Planned</text><text x="166" y="467" font-size="15" fill="#6b6776" font-weight="400">High priority</text><rect x="24" y="498" width="432" height="111" rx="10" fill="white" stroke="#e4e2e8"/><text x="42" y="529" font-size="20" fill="#15121f" font-weight="600">Internal operations</text><text x="42" y="556" font-size="15" fill="#6b6776" font-weight="400">Internal initiative</text><rect x="42" y="568" width="104" height="32" rx="8" fill="#e8eaf6" stroke="none"/><text x="54" y="590" font-size="15" fill="#5562a8" font-weight="600">In review</text><text x="166" y="590" font-size="15" fill="#6b6776" font-weight="400">Medium priority</text><text x="24" y="662" font-size="12" fill="#6b6776" font-weight="400">Illustrative interface · fictional sample records</text></g></svg>