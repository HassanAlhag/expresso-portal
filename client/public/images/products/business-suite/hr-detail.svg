<svg xmlns="http://www.w3.org/2000/svg" width="480" height="390" viewBox="0 0 480 390" role="img" aria-labelledby="title desc"><title id="title">Expresso Leave — illustrative interface</title><desc id="desc">Representative composition of the existing Expresso interface. Fictional sample records only. No real people, companies, emails, financial values or confidential information.</desc><metadata>Reference: LeaveRequestsPage.jsx; hr.constants.js; shared portalTheme.css. Static product composition, not a live screenshot. Summary values and private fields omitted.</metadata><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="480" height="390" rx="0" fill="#f7f7fa" stroke="none"/><rect x="0" y="0" width="480" height="58" rx="0" fill="white" stroke="none"/><text x="24" y="36" font-size="15" fill="#6b6776" font-weight="400">Expresso / People</text><rect x="316" y="14" width="140" height="32" rx="8" fill="#e8eaf6" stroke="none"/><text x="328" y="36" font-size="15" fill="#5562a8" font-weight="600">Sample view</text><path d="M0 58h480" stroke="#e4e2e8"/><text x="24" y="105" font-size="28" fill="#15121f" font-weight="600">Leave requests</text><rect x="24" y="130" width="432" height="80" rx="10" fill="white" stroke="#e4e2e8"/><text x="38" y="159" font-size="19" fill="#15121f" font-weight="600">Sample staff A</text><text x="38" y="186" font-size="15" fill="#6b6776" font-weight="400">Annual Leave</text><rect x="310" y="153" width="108" height="32" rx="8" fill="#e2f2ea" stroke="none"/><text x="322" y="175" font-size="15" fill="#2f7d5b" font-weight="600">Approved</text><rect x="24" y="225" width="432" height="80" rx="10" fill="white" stroke="#e4e2e8"/><text x="38" y="254" font-size="19" fill="#15121f" font-weight="600">Sample staff B</text><text x="38" y="281" font-size="15" fill="#6b6776" font-weight="400">Annual Leave</text><rect x="310" y="248" width="108" height="32" rx="8" fill="#fbebd6" stroke="none"/><text x="322" y="270" font-size="15" fill="#9a5300" font-weight="600">Submitted</text><text x="24" y="355" font-size="12" fill="#6b6776" font-weight="400">Names and dates are illustrative / omitted.</text><text x="24" y="374" font-size="12" fill="#6b6776" font-weight="400">Illustrative interface · fictional sample records</text></g></svg>