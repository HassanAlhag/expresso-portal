<svg xmlns="http://www.w3.org/2000/svg" width="480" height="680" viewBox="0 0 480 680" role="img" aria-labelledby="title desc"><title id="title">Expresso Leave — illustrative interface</title><desc id="desc">Representative composition of the existing Expresso interface. Fictional sample records only. No real people, companies, emails, financial values or confidential information.</desc><metadata>Reference: LeaveRequestsPage.jsx; hr.constants.js; shared portalTheme.css. Static product composition, not a live screenshot. Summary values and private fields omitted.</metadata><g font-family="Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="480" height="680" rx="0" fill="#f7f7fa" stroke="none"/><rect x="0" y="0" width="480" height="58" rx="0" fill="white" stroke="none"/><text x="24" y="36" font-size="15" fill="#6b6776" font-weight="400">Expresso / People</text><rect x="316" y="14" width="140" height="32" rx="8" fill="#e8eaf6" stroke="none"/><text x="328" y="36" font-size="15" fill="#5562a8" font-weight="600">Sample view</text><path d="M0 58h480" stroke="#e4e2e8"/><text x="24" y="105" font-size="28" fill="#15121f" font-weight="600">Leave</text><text x="24" y="138" font-size="15" fill="#6b6776" font-weight="400">Illustrative records · private fields omitted</text><rect x="24" y="164" width="432" height="48" rx="10" fill="white" stroke="#e4e2e8"/><text x="40" y="194" font-size="18" fill="#6b6776" font-weight="400">Search leave requests</text><rect x="24" y="232" width="432" height="111" rx="10" fill="white" stroke="#e4e2e8"/><text x="40" y="262" font-size="20" fill="#15121f" font-weight="600">Sample staff A</text><text x="40" y="293" font-size="16" fill="#6b6776" font-weight="400">Annual Leave</text><rect x="40" y="303" width="108" height="32" rx="8" fill="#e2f2ea" stroke="none"/><text x="52" y="325" font-size="15" fill="#2f7d5b" font-weight="600">Approved</text><rect x="24" y="356" width="432" height="111" rx="10" fill="white" stroke="#e4e2e8"/><text x="40" y="386" font-size="20" fill="#15121f" font-weight="600">Sample staff B</text><text x="40" y="417" font-size="16" fill="#6b6776" font-weight="400">Annual Leave</text><rect x="40" y="427" width="108" height="32" rx="8" fill="#fbebd6" stroke="none"/><text x="52" y="449" font-size="15" fill="#9a5300" font-weight="600">Submitted</text><rect x="24" y="480" width="432" height="111" rx="10" fill="white" stroke="#e4e2e8"/><text x="40" y="510" font-size="20" fill="#15121f" font-weight="600">Sample staff C</text><text x="40" y="541" font-size="16" fill="#6b6776" font-weight="400">Annual Leave</text><rect x="40" y="551" width="108" height="32" rx="8" fill="#f0eff3" stroke="none"/><text x="52" y="573" font-size="15" fill="#6b6776" font-weight="600">Cancelled</text><text x="24" y="645" font-size="12" fill="#6b6776" font-weight="400">Names and dates are illustrative / omitted.</text><text x="24" y="664" font-size="12" fill="#6b6776" font-weight="400">Illustrative interface · fictional sample records</text></g></svg>