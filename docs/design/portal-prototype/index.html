<style>
/* ==========================================================================
   Expresso Portal — design study prototype
   One token set, one component vocabulary, three persona lenses.
   Responsive rules use container queries on .app so the prototype's
   width switcher shows real laptop / tablet / mobile layouts.
   ========================================================================== */
:root {
  /* Brand */
  --lotus: #8390C8;          /* logo colour: fills, accents on dark */
  --lotus-600: #5562A8;      /* actions, links, selected states on light */
  --lotus-700: #444F8A;
  --lotus-100: #E8EAF6;
  --lotus-50: #F4F5FB;
  --espresso: #562D0F;
  --espresso-500: #7A4A27;
  --espresso-50: #F6EEE7;
  --sand: #F8F4EF;
  --night: #15121F;
  --night-2: #1E1A29;
  --night-3: #2A2536;
  --mist: #F7F7FA;
  --teal: #1F7A80;
  --teal-50: #E3F1F2;

  /* Neutrals */
  --surface: #FFFFFF;
  --surface-2: #F0EFF3;
  --line: #E4E2E8;
  --line-strong: #CFCCD6;
  --ink: #15121F;
  --ink-2: #4B4757;
  --muted: #6B6776;

  /* Status — the one status system */
  --ok: #2F7D5B;   --ok-50: #E2F2EA;
  --warn: #9A5300; --warn-50: #FBEBD6;
  --bad: #B2383B;  --bad-50: #FBE4E4;
  --info: #5562A8; --info-50: #E8EAF6;
  --idle: #6B6776; --idle-50: #F0EFF3;

  /* Persona lens (set on .app[data-persona]) */
  --persona: var(--lotus);
  --persona-ink: var(--lotus-600);
  --persona-soft: var(--lotus-50);

  --r-sm: 6px; --r: 10px; --r-lg: 14px;
  --shadow-1: 0 1px 2px rgba(21,18,31,.05);
  --shadow-2: 0 1px 2px rgba(21,18,31,.06), 0 8px 24px rgba(21,18,31,.08);
  --shadow-3: 0 12px 40px rgba(21,18,31,.18);
  --font: "Barlow", "ff-dax-pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --side-w: 248px;
  --side-rail: 68px;
  --top-h: 60px;
  --proto-h: 48px;
  color-scheme: light;
}
.app[data-persona="client"] { --persona: var(--espresso-500); --persona-ink: var(--espresso); --persona-soft: var(--sand); }
.app[data-persona="vendor"] { --persona: #3E9AA0; --persona-ink: var(--teal); --persona-soft: var(--teal-50); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #E9E8EE; color: var(--ink); font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--lotus-600); }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.005em; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--lotus-600); outline-offset: 2px; border-radius: 4px; }
.num, td.num, .tnum { font-variant-numeric: tabular-nums lining-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.icon.sm { width: 16px; height: 16px; }

/* ---------- Prototype controls (not product UI) ---------- */
.proto {
  position: sticky; top: 0; z-index: 60; height: var(--proto-h);
  display: flex; align-items: center; gap: 14px; padding: 0 16px;
  background: repeating-linear-gradient(135deg, #FFFFFF 0 10px, #FAFAFC 10px 20px);
  border-bottom: 1px dashed var(--line-strong);
  overflow-x: auto; white-space: nowrap; scrollbar-width: thin;
  font-size: 13px;
}
.proto-tag { font-weight: 600; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.proto-tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }

.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border-radius: 9px; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 7px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); font-weight: 600; }
.seg .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
.proto-link { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 13px; font-weight: 500; }

/* ---------- Stage / device frames ---------- */
.stage { height: calc(100vh - var(--proto-h)); height: calc(100dvh - var(--proto-h)); display: flex; justify-content: center; align-items: flex-start; overflow: auto; }

.stage[data-frame="laptop"] .app { width: 1280px; height: 800px; }
.stage[data-frame="tablet"] .app { width: 820px; height: 1100px; }
.stage[data-frame="mobile"] .app { width: 390px; height: 800px; }
.stage:not([data-frame="fit"]) .app { flex: none; border-radius: 18px; box-shadow: var(--shadow-3); border: 8px solid var(--night); }
.stage[data-frame="mobile"] .app { border-radius: 34px; border-width: 10px; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); height: 100%; transition: grid-template-columns .2s ease; }
.shell.collapsed { grid-template-columns: var(--side-rail) minmax(0, 1fr); }

.side { background: var(--night); color: #D9D7E0; display: flex; flex-direction: column; min-height: 0; position: relative; z-index: 30; }
.side-head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; height: 64px; }

.side-head .wordmark { display: grid; line-height: 1.15; min-width: 0; }
.side-head .wordmark b { color: #fff; font-weight: 600; font-size: 15.5px; letter-spacing: .01em; }
.side-head .wordmark span { color: #A7A3B2; font-size: 12px; }
.workspace { margin: 4px 12px 10px; padding: 10px 12px; border-radius: var(--r); background: var(--night-2); border: 1px solid var(--night-3); display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; position: relative; overflow: hidden; }
.workspace::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--persona); }
.workspace .ava { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 600; font-size: 12.5px; color: var(--night); background: var(--persona); }
.workspace b { display: block; color: #fff; font-weight: 600; font-size: 13.5px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.workspace span { font-size: 12px; color: #A7A3B2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.nav { flex: 1; overflow-y: auto; padding: 4px 10px 12px; scrollbar-width: thin; scrollbar-color: var(--night-3) transparent; }
.nav-group { margin-top: 14px; }
.nav-group:first-child { margin-top: 4px; }
.nav-label { font-size: 12px; color: #8A8698; padding: 0 10px 6px; font-weight: 500; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 8px; color: #CFCCD8; text-decoration: none; font-size: 14.5px; font-weight: 500; position: relative; }
.nav a:hover { background: var(--night-2); color: #fff; }
.nav a[aria-current="page"] { background: var(--night-3); color: #fff; }
.nav a[aria-current="page"]::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--persona); }

.nav a[aria-current="page"] .icon { color: var(--persona); }
.nav a .count { margin-left: auto; font-size: 12px; font-weight: 600; background: var(--night-3); color: #E6E4EC; border-radius: 999px; padding: 0 7px; line-height: 20px; }
.nav a[aria-current="page"] .count { background: var(--persona); color: var(--night); }
.nav .secondary a { font-size: 13.5px; padding: 6px 10px; color: #A7A3B2; }
.nav .locked { display: flex; align-items: center; gap: 11px; padding: 6px 10px; font-size: 13px; color: #6F6B7E; }
.side-foot { padding: 10px 12px 14px; border-top: 1px solid var(--night-3); display: flex; gap: 8px; align-items: center; }
.side-foot .collapse-btn { border: 1px solid var(--night-3); background: transparent; color: #A7A3B2; border-radius: 8px; height: 32px; padding: 0 8px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.side-foot .collapse-btn:hover { color: #fff; border-color: #4A4460; }
.side-foot .ver { font-size: 11.5px; color: #6F6B7E; margin-left: auto; }

.shell.collapsed .side .wordmark, .shell.collapsed .side .nav-label, .shell.collapsed .side .nav a span:not(.count), .shell.collapsed .side .nav a .count, .shell.collapsed .workspace > div:last-child, .shell.collapsed .side-foot .ver, .shell.collapsed .side-foot .collapse-btn span, .shell.collapsed .nav .locked span { display: none; }
.shell.collapsed .side-head { justify-content: center; padding-inline: 0; }
.shell.collapsed .workspace { margin-inline: 10px; padding: 8px; grid-template-columns: 1fr; justify-items: center; }
.shell.collapsed .nav a { justify-content: center; padding: 10px 0; }
.shell.collapsed .nav-group { margin-top: 10px; border-top: 1px solid var(--night-3); padding-top: 10px; }
.shell.collapsed .nav-group:first-child { border-top: 0; padding-top: 0; }
.shell.collapsed .side-foot { justify-content: center; }
.shell.collapsed .side-foot .collapse-btn .icon { transform: scaleX(-1); }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { height: var(--top-h); flex: none; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 20; }
.top .menu-btn { display: none; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--lotus-600); text-decoration: underline; }
.crumbs .icon { width: 14px; height: 14px; color: var(--line-strong); }
.crumbs b { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.top-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.search { display: flex; align-items: center; gap: 8px; height: 38px; width: 300px; border: 1px solid var(--line); background: var(--mist); border-radius: 10px; padding: 0 10px; color: var(--muted); font-size: 14px; text-align: left; }
.search:hover { border-color: var(--line-strong); }
.search > span:not(.kbd) { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kbd { font-size: 11.5px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 1px 6px; color: var(--muted); }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid transparent; background: transparent; display: inline-grid; place-items: center; color: var(--ink-2); position: relative; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn .pip { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); border: 2px solid var(--surface); }
.user-btn { display: flex; align-items: center; gap: 10px; border: 1px solid transparent; background: transparent; border-radius: 10px; padding: 4px 8px 4px 4px; }
.user-btn:hover { background: var(--surface-2); }
.user-btn .ava { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13px; background: var(--persona-soft); color: var(--persona-ink); border: 1px solid color-mix(in srgb, var(--persona) 35%, transparent); }
.user-btn .who { display: grid; text-align: left; line-height: 1.2; }
.user-btn .who b { font-size: 13.5px; font-weight: 600; }
.user-btn .who span { font-size: 12px; color: var(--muted); }

.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
.page { max-width: 1360px; margin: 0 auto; padding: 28px 32px 56px; display: grid; gap: 22px; }

/* ---------- Page header ---------- */
.page-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 24px; align-items: end; }
.page-head h1 { font-size: 28px; line-height: 1.15; }
.page-head .desc { color: var(--muted); margin-top: 6px; max-width: 70ch; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.page-head .meta-line { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 10px; color: var(--muted); font-size: 13.5px; }
.page-head .meta-line > span { display: inline-flex; gap: 6px; align-items: center; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--mist); border-color: #B9B5C4; }
.btn.primary { background: var(--lotus-600); border-color: var(--lotus-600); color: #fff; }
.btn.primary:hover { background: var(--lotus-700); border-color: var(--lotus-700); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--lotus-600); padding-inline: 10px; }
.btn.quiet:hover { background: var(--lotus-50); }
.btn.danger { color: var(--bad); }
.btn.danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { height: 32px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn .icon { width: 16px; height: 16px; }

/* ---------- Surfaces ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 0; }
.panel-head h2 { font-size: 16.5px; }
.panel-head .sub { font-size: 13px; color: var(--muted); }
.panel-head a, .panel-head .link { font-size: 13.5px; font-weight: 600; color: var(--lotus-600); text-decoration: none; background: none; border: 0; padding: 0; }
.panel-head a:hover, .panel-head .link:hover { text-decoration: underline; }
.panel-body { padding: 14px 20px 20px; }
.panel.flush .panel-body { padding: 8px 0 4px; }
.grid { display: grid; gap: 18px; }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols-main { grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); }
.cols-detail { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
.stack { display: grid; gap: 18px; align-content: start; min-width: 0; }

/* ---------- Briefing (dashboard hero) ---------- */
.briefing { position: relative; border-radius: var(--r-lg); padding: 26px 28px 24px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.briefing::after { content: ""; position: absolute; right: -40px; bottom: -64px; width: 300px; height: 200px; background: var(--brand-mark) center / contain no-repeat; opacity: .10; pointer-events: none; }
.briefing .when { color: var(--muted); font-size: 14px; }
.briefing h1 { font-size: clamp(24px, 3.2cqi, 34px); line-height: 1.2; margin-top: 6px; max-width: 30ch; font-weight: 500; }
.briefing h1 strong { font-weight: 600; }
.briefing .jump { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; position: relative; z-index: 1; }
.briefing .jump button, .briefing .jump a { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--mist); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 500; text-decoration: none; color: var(--ink); }
.briefing .jump button:hover, .briefing .jump a:hover { border-color: var(--lotus-600); color: var(--lotus-600); }
.briefing .jump b { font-weight: 600; font-variant-numeric: tabular-nums; }
.app[data-persona="client"] .briefing { background: var(--sand); border-color: #EADFD3; }
.app[data-persona="client"] .briefing .jump button, .app[data-persona="client"] .briefing .jump a { background: #fff; border-color: #EADFD3; }
.app[data-persona="vendor"] .briefing { background: #F3F9F9; border-color: #D5E9EA; }
.app[data-persona="vendor"] .briefing .jump a, .app[data-persona="vendor"] .briefing .jump button { background: #fff; border-color: #D5E9EA; }
#main:focus { outline: none; }

/* ---------- Metrics strip (KPI blocks) ---------- */
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.metric { padding: 16px 20px 18px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.metric + .metric { border-left: 1px solid var(--line); }
.metric .label { font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.metric .value { font-size: 28px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums lining-nums; letter-spacing: -.01em; }
.metric .value small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.metric .delta { font-size: 13px; display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
.metric .delta.up { color: var(--ok); } .metric .delta.down { color: var(--bad); }
.metric .delta .icon { width: 14px; height: 14px; }
.bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--lotus-600); }
.bar.ok > i { background: var(--ok); } .bar.warn > i { background: #C77700; } .bar.bad > i { background: var(--bad); } .bar.persona > i { background: var(--persona); }

/* ---------- Attention list ---------- */

.attn li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--line); }

.attn .kind.warn { background: var(--warn-50); color: var(--warn); }
.attn .kind.info { background: var(--info-50); color: var(--info); }
.attn .kind.ok { background: var(--ok-50); color: var(--ok); }
.attn .t { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.attn .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
.attn .go { display: flex; gap: 6px; }

/* ---------- Badges (status) ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; background: var(--idle-50); color: var(--idle); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.badge.bad { background: var(--bad-50); color: var(--bad); }

.badge.plain::before { display: none; }
.pill { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.health { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 500; }
.health i { width: 9px; height: 9px; border-radius: 3px; background: var(--idle); }
.health.ok i { background: var(--ok); } .health.warn i { background: #D48A1F; } .health.bad i { background: var(--bad); }

/* ---------- Toolbar / filters ---------- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.field-search { display: flex; align-items: center; gap: 8px; height: 38px; border: 1px solid var(--line-strong); border-radius: 9px; padding: 0 10px; background: var(--surface); min-width: 240px; flex: 1 1 240px; max-width: 360px; }
.field-search:focus-within { border-color: var(--lotus-600); box-shadow: 0 0 0 3px var(--lotus-100); }
.field-search input { border: 0; outline: 0; background: transparent; width: 100%; font-size: 14px; }
.field-search .icon { color: var(--muted); }
.select { position: relative; }
.select select { appearance: none; height: 38px; border: 1px solid var(--line-strong); border-radius: 9px; padding: 0 34px 0 12px; background: var(--surface); font-size: 14px; font-weight: 500; cursor: pointer; }
.select::after { content: ""; position: absolute; right: 13px; top: 50%; width: 7px; height: 7px; border-right: 1.75px solid var(--muted); border-bottom: 1.75px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.select select:focus-visible { outline: 0; border-color: var(--lotus-600); box-shadow: 0 0 0 3px var(--lotus-100); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 500; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.chip b { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip[aria-pressed="true"] b { color: #C9C6D3; }
.toolbar .spacer { flex: 1; }
.result-count { font-size: 13px; color: var(--muted); }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
table.data th { position: sticky; top: 0; background: var(--surface); text-align: left; font-size: 13px; font-weight: 600; color: var(--muted); padding: 11px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 1; }
table.data th.num, table.data td.num { text-align: right; }

table.data td { padding: 13px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data tbody tr:last-child td { border-bottom: 0; }
table.data tbody tr.clickable { cursor: pointer; }
table.data tbody tr.clickable:hover td { background: var(--lotus-50); }
table.data tbody tr.clickable:focus-visible { outline: 2px solid var(--lotus-600); outline-offset: -2px; }
.cell-main { display: grid; gap: 2px; min-width: 0; }
.cell-main b { font-weight: 600; color: var(--ink); }
.cell-main span { font-size: 13px; color: var(--muted); }
.ident { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mono-ava { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; background: var(--surface-2); color: var(--ink-2); }
.person { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.person i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 600; font-size: 11px; background: var(--lotus-100); color: var(--lotus-700); }
.progress { display: grid; grid-template-columns: minmax(70px, 1fr) 40px; gap: 10px; align-items: center; min-width: 130px; }
.progress span { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-2); text-align: right; }
.due-bad { color: var(--bad); font-weight: 600; }
.due-warn { color: var(--warn); font-weight: 600; }
.row-link { color: var(--ink); text-decoration: none; }
.row-arrow { color: var(--line-strong); width: 16px; }
tr.clickable:hover .row-arrow { color: var(--lotus-600); }

.pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--muted); flex-wrap: wrap; }
.pager .pages { display: flex; gap: 4px; }
.pager .pages button { min-width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--ink-2); display: inline-grid; place-items: center; }
.pager .pages button[aria-current="page"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.pager .pages button[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- Lists ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.list > li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 20px; border-top: 1px solid var(--line); }
.list > li:first-child { border-top: 0; }
.list .t { font-weight: 600; font-size: 14px; }
.list .s { font-size: 13px; color: var(--muted); }
.list .r { text-align: right; display: grid; gap: 2px; justify-items: end; }
.list .r b { font-variant-numeric: tabular-nums; font-weight: 600; }
.list.click > li { cursor: pointer; }
.list.click > li:hover { background: var(--lotus-50); }

/* ---------- Timeline ---------- */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 16px; }
.timeline li::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child { padding-bottom: 0; }
.timeline li:last-child::before { display: none; }
.timeline .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); z-index: 1; }
.timeline .dot .icon { width: 14px; height: 14px; }
.timeline .dot.ok { background: var(--ok-50); color: var(--ok); }
.timeline .dot.info { background: var(--info-50); color: var(--info); }
.timeline .dot.warn { background: var(--warn-50); color: var(--warn); }
.timeline .dot.persona { background: var(--persona-soft); color: var(--persona-ink); }
.timeline .what { font-size: 14px; line-height: 1.4; padding-top: 3px; }
.timeline .what b { font-weight: 600; }
.timeline .when { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

/* ---------- Stepper (status flow) ---------- */
.flow { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0; counter-reset: s; }
.flow .st { position: relative; padding: 0 8px 0 0; display: grid; gap: 8px; align-content: start; }
.flow .st::before { content: ""; height: 4px; border-radius: 99px; background: var(--surface-2); }
.flow .st.done::before { background: var(--ok); }
.flow .st.now::before { background: linear-gradient(90deg, var(--lotus-600) 50%, var(--surface-2) 50%); }
.flow .st b { font-size: 13.5px; font-weight: 600; }
.flow .st span { font-size: 12.5px; color: var(--muted); }
.flow .st.todo b { color: var(--muted); font-weight: 500; }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: none; padding: 10px 14px 12px; font-size: 14.5px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--lotus-600); font-weight: 600; }
.tabs button .count { font-size: 12px; background: var(--surface-2); border-radius: 999px; padding: 0 7px; line-height: 19px; font-weight: 600; color: var(--ink-2); }
.tabs button .icon { width: 15px; height: 15px; }

/* ---------- Key-value / definition ---------- */
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 10px 14px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.fig-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
.fig { padding: 4px 16px; display: grid; gap: 2px; }
.fig:first-child { padding-left: 0; }
.fig + .fig { border-left: 1px solid var(--line); }
.fig span { font-size: 13px; color: var(--muted); }
.fig b { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- Files ---------- */
.files { list-style: none; margin: 0; padding: 0; }
.files li { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 20px; border-top: 1px solid var(--line); }
.files li:first-child { border-top: 0; }
.ftype { width: 38px; height: 44px; border-radius: 7px; border: 1px solid var(--line); background: var(--mist); display: grid; place-items: end center; padding-bottom: 6px; font-size: 10px; font-weight: 700; color: var(--ink-2); position: relative; }
.ftype::before { content: ""; position: absolute; top: -1px; right: -1px; width: 11px; height: 11px; background: linear-gradient(225deg, #E9E8EE 50%, var(--line) 50%); border-bottom-left-radius: 3px; }
.ftype.pdf { color: var(--bad); } .ftype.fig { color: var(--lotus-600); } .ftype.xls { color: var(--ok); } .ftype.zip { color: var(--espresso-500); } .ftype.mp4 { color: var(--teal); }
.files .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.files .s { font-size: 12.5px; color: var(--muted); }
.files .acts { display: flex; gap: 4px; align-items: center; }
.vis { font-size: 12px; font-weight: 600; color: var(--persona-ink); background: var(--persona-soft); border-radius: 5px; padding: 1px 7px; }

/* ---------- Alerts / notices ---------- */
.alert { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 14px 16px; border-radius: var(--r); border: 1px solid; font-size: 14px; }
.alert b { display: block; font-weight: 600; margin-bottom: 2px; }
.alert.info { background: var(--lotus-50); border-color: var(--lotus-100); color: var(--ink); } .alert.info > .icon { color: var(--lotus-600); }
.alert.warn { background: #FFF8EE; border-color: #F3DDBE; } .alert.warn > .icon { color: var(--warn); }
.alert.bad { background: #FFF5F5; border-color: #F2CACA; } .alert.bad > .icon { color: var(--bad); }
.alert.ok { background: #F3FAF6; border-color: #CBE6D8; } .alert.ok > .icon { color: var(--ok); }
.alert.persona { background: var(--persona-soft); border-color: color-mix(in srgb, var(--persona) 30%, transparent); }
.alert.persona > .icon { color: var(--persona-ink); }
.alert p { color: var(--ink-2); }

/* ---------- Empty / loading / error ---------- */
.state { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 48px 24px; }
.state .glyph { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); margin-bottom: 6px; }
.state .glyph .icon { width: 24px; height: 24px; }
.state.err .glyph { background: var(--bad-50); color: var(--bad); }
.state h3 { font-size: 17px; }
.state p { color: var(--muted); max-width: 46ch; font-size: 14px; }
.state .btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
.skel { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2) 0, #F7F6F9 40%, var(--surface-2) 80%); background-size: 300% 100%; animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.skel-row td { padding: 16px; }

/* ---------- Forms ---------- */
.form { display: grid; gap: 16px; }
.form .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.fld { display: grid; gap: 6px; }
.fld label { font-size: 13.5px; font-weight: 600; }
.fld .hint { font-size: 12.5px; color: var(--muted); }
.fld .err { font-size: 12.5px; color: var(--bad); font-weight: 500; display: flex; gap: 6px; align-items: center; }
.inp, .fld textarea, .fld select { width: 100%; height: 40px; border: 1px solid var(--line-strong); border-radius: 9px; padding: 0 12px; background: var(--surface); font-size: 14.5px; }
.fld textarea { height: auto; min-height: 96px; padding: 10px 12px; resize: vertical; line-height: 1.45; }
.inp:focus, .fld textarea:focus, .fld select:focus { outline: 0; border-color: var(--lotus-600); box-shadow: 0 0 0 3px var(--lotus-100); }
.inp.invalid { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-50); }
.inp-affix { display: flex; align-items: stretch; border: 1px solid var(--line-strong); border-radius: 9px; overflow: hidden; background: var(--surface); }
.inp-affix:focus-within { border-color: var(--lotus-600); box-shadow: 0 0 0 3px var(--lotus-100); }
.inp-affix span { display: grid; place-items: center; padding: 0 10px; background: var(--mist); color: var(--muted); font-size: 13px; font-weight: 600; border-right: 1px solid var(--line); }
.inp-affix input { border: 0; outline: 0; height: 38px; padding: 0 12px; width: 100%; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--r); padding: 18px; display: grid; justify-items: center; gap: 4px; text-align: center; color: var(--muted); font-size: 13.5px; background: var(--mist); }
.drop b { color: var(--lotus-600); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--lotus-600); }
.line-items { width: 100%; border-collapse: collapse; font-size: 14px; }
.line-items th { text-align: left; font-size: 12.5px; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.line-items td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.line-items .inp-affix input { height: 34px; }
.total-row { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0 0; font-size: 15px; }
.total-row b { font-size: 22px; font-variant-numeric: tabular-nums; }

/* ---------- Drawer / modal / menus ---------- */
.scrim { position: absolute; inset: 0; background: rgba(21,18,31,.36); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .18s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); box-shadow: var(--shadow-3); z-index: 45; display: flex; flex-direction: column; transform: translateX(104%); transition: transform .22s ease; }
.drawer.open { transform: none; }
.drawer[hidden] { display: none; }
.drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 22px 14px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { font-size: 19px; }
.drawer-head .sub { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 18px 22px 24px; display: grid; gap: 20px; align-content: start; }
.drawer-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; background: var(--mist); }
.drawer-foot .left { margin-right: auto; }
.sec-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.modal-wrap { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; pointer-events: none; }
.modal-wrap:has(.modal) { background: rgba(21,18,31,.28); pointer-events: auto; }
.drawer-body .checks > li { padding-inline: 0; }
.checks .t { display: flex; gap: 8px; align-items: center; }
.modal { width: min(460px, 100%); background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-3); pointer-events: auto; transform: translateY(8px) scale(.98); opacity: 0; transition: transform .16s, opacity .16s; }
.modal.open { transform: none; opacity: 1; }
.modal-body { padding: 22px 22px 6px; display: grid; gap: 10px; }
.modal-body .glyph { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--lotus-50); color: var(--lotus-600); }
.modal-body .glyph.warn { background: var(--warn-50); color: var(--warn); }
.modal-body h2 { font-size: 18px; }
.modal-body p { color: var(--ink-2); font-size: 14.5px; }
.modal-body ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; display: grid; gap: 4px; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 16px 22px 20px; }
.menu { position: absolute; z-index: 35; min-width: 220px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-2); padding: 6px; display: none; }
.menu.open { display: block; }
.menu button, .menu a { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 8px 10px; border-radius: 8px; font-size: 14px; text-align: left; text-decoration: none; color: var(--ink); }
.menu button:hover, .menu a:hover { background: var(--mist); }
.menu .sep { height: 1px; background: var(--line); margin: 6px 4px; }
.menu .head { padding: 8px 10px 6px; font-size: 13px; color: var(--muted); }
.menu .head b { display: block; color: var(--ink); font-size: 14px; }
.menu button.dim { color: var(--muted); }
.menu-anchor { position: relative; }
.notif { width: 360px; padding: 0; }
.notif .nh { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
.notif .nh span { font-size: 12.5px; color: var(--muted); font-weight: 500; }
.notif ul { list-style: none; margin: 0; padding: 4px; }
.notif li { display: grid; grid-template-columns: 8px 1fr; gap: 10px; padding: 10px; border-radius: 8px; font-size: 13.5px; }
.notif li:hover { background: var(--mist); }
.notif li i { width: 8px; height: 8px; border-radius: 50%; background: var(--lotus-600); margin-top: 6px; }
.notif li.read i { background: transparent; }
.notif li span { display: block; color: var(--muted); font-size: 12.5px; }
.notif .nf { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }

.toasts { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 70; display: grid; gap: 8px; width: min(440px, calc(100% - 32px)); pointer-events: none; }
.toast { background: var(--night); color: #fff; border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; box-shadow: var(--shadow-3); font-size: 14px; animation: toastIn .2s ease; }
.toast .icon { color: #7FD3A8; }
.toast span { color: #B9B5C4; display: block; font-size: 13px; }
@keyframes toastIn { from { transform: translateY(8px); opacity: 0; } }

/* ---------- Conversation (tickets) ---------- */
.convo { display: grid; gap: 14px; }
.msg { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
.msg .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 12px; background: var(--surface-2); }
.msg.staff .av { background: var(--lotus-100); color: var(--lotus-700); }
.msg.client .av { background: var(--espresso-50); color: var(--espresso); }
.msg .bubble { border: 1px solid var(--line); border-radius: 4px 12px 12px 12px; padding: 12px 14px; background: var(--surface); }
.msg.staff .bubble { background: var(--lotus-50); border-color: var(--lotus-100); }
.msg .who { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.msg .who b { color: var(--ink); font-weight: 600; margin-right: 6px; }
.composer { border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); }
.composer textarea { border: 0; outline: 0; width: 100%; min-height: 80px; resize: vertical; padding: 12px 14px; background: transparent; font-size: 14.5px; }
.composer .bar2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); }
.composer:focus-within { border-color: var(--lotus-600); box-shadow: 0 0 0 3px var(--lotus-100); }

/* ---------- Comparison (quotations) ---------- */
.compare { display: grid; grid-template-columns: 180px repeat(var(--n, 3), minmax(170px, 1fr)); overflow-x: auto; font-size: 14px; }
.compare > div { padding: 12px 14px; border-bottom: 1px solid var(--line); min-width: 0; }
.compare .rh { color: var(--muted); font-weight: 500; background: var(--mist); position: sticky; left: 0; z-index: 1; }
.compare .ch { display: grid; gap: 4px; align-content: start; padding-top: 16px; }
.compare .ch b { font-size: 15px; }
.compare .best { background: #F3FAF6; }
.compare .best-tag { font-size: 12px; font-weight: 600; color: var(--ok); display: inline-flex; gap: 4px; align-items: center; }
.compare .price { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.compare .rec { box-shadow: inset 0 3px 0 var(--ok); }

/* ---------- Misc ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.stackbar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; gap: 2px; background: var(--surface-2); }
.stackbar i { display: block; height: 100%; }
.aging { display: grid; gap: 12px; }
.aging-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 110px; gap: 12px; align-items: center; font-size: 14px; }
.aging-row .bar { height: 10px; }
.aging-row b { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.cat-tree { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.cat-tree > li { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.cat-tree .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; }
.cat-tree .subs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.note { font-size: 13px; color: var(--muted); }
.divider { height: 1px; background: var(--line); }
.inline-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; }
.tag-row { display: flex; gap: 6px; flex-wrap: wrap; }
.big-num { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.muted { color: var(--muted); }
.ok-text { color: var(--ok); } .bad-text { color: var(--bad); } .warn-text { color: var(--warn); }
.locked-panel { border: 1px dashed var(--line-strong); border-radius: var(--r-lg); background: var(--surface); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.swatch { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); font-size: 13px; }
.swatch i { display: block; height: 56px; }
.swatch div { padding: 8px 10px; }
.swatch b { display: block; }
.gallery-sec { display: grid; gap: 12px; }
.gallery-sec > h2 { font-size: 18px; }
.demo-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.vendor-safe { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--teal); background: var(--teal-50); border-radius: 6px; padding: 3px 8px; }
.persona-note { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--persona-ink); background: var(--persona-soft); border-radius: 6px; padding: 3px 8px; }
.score { display: inline-grid; place-items: center; width: 40px; height: 28px; border-radius: 7px; font-weight: 600; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.score.ok { background: var(--ok-50); color: var(--ok); } .score.warn { background: var(--warn-50); color: var(--warn); } .score.bad { background: var(--bad-50); color: var(--bad); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font-size: 12.5px; text-align: center; }
.cal .d { padding: 6px 0; border-radius: 6px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cal .h { color: var(--muted); font-weight: 600; }
.cal .off { background: var(--warn-50); color: var(--warn); font-weight: 600; }
.cal .today { outline: 2px solid var(--lotus-600); outline-offset: -2px; font-weight: 600; }
.cal .we { color: #B3AFBE; }

/* ==========================================================================
   Responsive (container queries on .app)
   ========================================================================== */
/* Wide desktop: above 1440 px the side gutters grow gradually (32 → 64 px) and
   the content cap rises to 1600 px, so 1600–1800 px screens are neither
   stretched nor framed by large empty margins. 1440 px and below are unchanged. */
@container app (min-width: 1441px) {
  .page { max-width: 1600px; padding-inline: clamp(32px, calc(32px + (100cqi - 1440px) * 0.1), 64px); }
}
@container app (max-width: 1180px) {
  .hide-lg { display: none !important; }
  .cols-main { grid-template-columns: minmax(0, 1fr); }
  .cols-detail { grid-template-columns: minmax(0, 1fr); }
  .search { width: 220px; }
  .user-btn .who { display: none; }
}
@container app (max-width: 960px) {
  .shell, .shell.collapsed { grid-template-columns: minmax(0, 1fr); }
  .side { position: absolute; left: 0; top: 0; bottom: 0; width: 280px; transform: translateX(-102%); transition: transform .22s ease; box-shadow: var(--shadow-3); z-index: 46; }
  .shell.nav-open .side { transform: none; }
  .shell.collapsed .side .wordmark, .shell.collapsed .side .nav-label, .shell.collapsed .side .nav a span:not(.count), .shell.collapsed .side .nav a .count, .shell.collapsed .workspace > div:last-child, .shell.collapsed .nav .locked span { display: revert; }
  .shell.collapsed .nav a { justify-content: flex-start; padding: 8px 10px; }

<script>
/* Expresso Portal design study — prototype behaviour. No network, no storage. */
(() => {
"use strict";

/* ------------------------------------------------------------------ helpers */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ic = (n, cls = "") => `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${n}"></use></svg>`;
const fmt = (n) => Number(n).toLocaleString("en-US");
const aed = (n) => `AED ${fmt(n)}`;
const aedK = (n) => (n >= 1e6 ? `AED ${(n / 1e6).toFixed(2)}m` : `AED ${(n / 1000).toFixed(n % 1000 >= 100 ? 1 : 0)}k`);
const client = (id) => CLIENTS.find((c) => c.id === id) || { name: id };
const initials = (name) => name.split(/\s+/).filter((w) => /^[A-Za-z]/.test(w)).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
const person = (code) => `<span class="person"><i>${esc(code)}</i>${esc(PEOPLE[code]?.name || code)}</span>`;
const TONE = {
  Active: "ok", "At risk": "bad", Onboarding: "info", Paused: "", Prospect: "outline",
  "In progress": "info", Planning: "", "In review": "warn", "On hold": "warn", Completed: "ok", Archived: "",
  Due: "info", Overdue: "bad", Paid: "ok", "Part paid": "warn", Draft: "outline",
  Pending: "warn", Approved: "ok", Rejected: "bad", Declined: "bad",
  Published: "info", Evaluating: "warn", Awarded: "ok", Closed: "",
  Submitted: "info", Accepted: "ok", "Not selected": "", "Not quoted": "outline", Open: "info", "Awarded to you": "ok",
  "Waiting on you": "warn", Resolved: "ok", "On leave": "warn", Probation: "info", Suspended: "bad",
  "To do": "", Done: "ok", "Needs your review": "warn", "Invitation sent": "info", High: "bad", Normal: "", Low: "",
};
const badge = (s, extra = "") => `<span class="badge ${TONE[s] ?? ""} ${extra}">${esc(s)}</span>`;
const HEALTH = { ok: "On track", warn: "At risk", bad: "Off track", idle: "No activity" };
const health = (h) => `<span class="health ${h}"><i></i>${HEALTH[h]}</span>`;
const bar = (pct, tone = "") => `<div class="bar ${tone}" role="presentation"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>`;
const progress = (pct, h) => `<div class="progress">${bar(pct, h === "bad" ? "bad" : h === "warn" ? "warn" : "")}<span>${pct}%</span></div>`;

/* --------------------------------------------------------------------- state */
const S = {
  persona: "manager", frame: "fit", sim: "normal", collapsed: false, navOpen: false,
  f: {}, sort: {}, lastFocus: null,
};
const P = () => PERSONAS[S.persona];
const can = (perm) => P().perms.includes(perm);
const kind = () => P().kind;

/* --------------------------------------------------------------- navigation */
const NAV = {
  staff: [
    { label: "Workspace", items: [{ id: "dashboard", label: "Overview", icon: "home", perm: "dashboard" }] },
    { label: "Business", items: [

function parseHash() {
  const raw = location.hash.replace(/^#\/?/, "");
  const [path, qs] = raw.split("?");
  const parts = path.split("/").filter(Boolean).map(decodeURIComponent);
  const q = Object.fromEntries(new URLSearchParams(qs || ""));
  let [persona, page, id] = parts;
  if (!PERSONAS[persona]) persona = "manager";
  return { persona, page: page || HOME[PERSONAS[persona].kind], id, q };
}

  if (S.navOpen) { S.navOpen = false; $(".shell")?.classList.remove("nav-open"); $("[data-act=nav-open]")?.setAttribute("aria-expanded", "false"); }
  closeMenu();
  if (S.lastFocus && document.contains(S.lastFocus)) S.lastFocus.focus({ preventScroll: true });
  S.lastFocus = null;
}
function confirmModal({ icon = "info", tone = "", title, body, confirm, danger = false, onConfirm }) {
  closeMenu();
  const prevFocus = document.activeElement;
  const wrap = $("#modal-wrap");
  wrap.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="m-title" aria-describedby="m-body"><div class="modal-body"><div class="glyph ${tone}">${ic(icon)}</div><h2 id="m-title">${title}</h2><div id="m-body">${body}</div></div><div class="modal-foot"><button class="btn" data-m="cancel">Cancel</button><button class="btn ${danger ? "danger-solid" : "primary"}" data-m="ok">${confirm}</button></div></div>`;
  $("#scrim").classList.add("on");
  const m = wrap.firstElementChild;
  requestAnimationFrame(() => { m.classList.add("open"); m.querySelector('[data-m="ok"]').focus(); });
  const done = (ok) => { wrap.innerHTML = ""; if (!$("#drawer").classList.contains("open")) $("#scrim").classList.remove("on"); prevFocus && document.contains(prevFocus) && prevFocus.focus(); if (ok) onConfirm(); };
  m.addEventListener("click", (e) => { const b = e.target.closest("[data-m]"); if (b) done(b.dataset.m === "ok"); });
  m.addEventListener("keydown", (e) => { if (e.key === "Escape") { e.stopPropagation(); done(false); } trapTab(e, m); });
}
function toast(title, sub = "") {
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `${ic("check")}<div><b>${esc(title)}</b>${sub ? `<span>${esc(sub)}</span>` : ""}</div>`;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), 3600);
}
function trapTab(e, root) {
  if (e.key !== "Tab") return;
  const f = $$('a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])', root).filter((x) => x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

/* menus */
let menuOwner = null;
function closeMenu() {
  const m = $("#menu");
  if (m) { m.classList.remove("open"); m.className = "menu"; }
  if (menuOwner) menuOwner.setAttribute("aria-expanded", "false");
  menuOwner = null;
}
function openMenu(btn, id) {
  if (menuOwner === btn) { closeMenu(); return; }
  closeMenu();
  const m = $("#menu");
  const k = kind();
  let html = "";
  if (id === "user") html = `<div class="head"><b>${esc(P().user.name)}</b>${esc(P().user.sub)}</div><div class="sep"></div><button role="menuitem" data-act="toast" data-msg="Profile|Not part of this study.">${ic("user")}Your profile</button><button role="menuitem" data-act="toast" data-msg="Notification settings|Not part of this study.">${ic("bell")}Notification settings</button><div class="sep"></div><button role="menuitem" class="dim" data-act="toast" data-msg="Signed out|Not really — this is a prototype.">${ic("logout")}Sign out</button>`;
  if (id === "create") html = `<button role="menuitem" data-act="toast" data-msg="New project|Not part of this study.">${ic("folder")}Project</button>${can("finance") ? `<button role="menuitem" data-act="toast" data-msg="New invoice|Not part of this study.">${ic("receipt")}Invoice</button>` : ""}${can("procurement") ? `<button role="menuitem" data-act="toast" data-msg="New RFQ|Not part of this study.">${ic("box")}RFQ</button>` : ""}${can("finance") ? `<button role="menuitem" data-act="toast" data-msg="New client|Not part of this study.">${ic("building")}Client</button>` : ""}<button role="menuitem" data-act="toast" data-msg="New task|Not part of this study.">${ic("check")}Task</button>`;
  if (id === "notifs") { m.classList.add("notif"); html = `<div class="nh">Notifications<span>${NOTIFS[k].filter((n) => !n[2]).length} unread</span></div><ul>${NOTIFS[k].map(([t, s, read]) => `<li class="${read ? "read" : ""}"><i></i><div>${esc(t)}<span>${esc(s)}</span></div></li>`).join("")}</ul><div class="nf">The full notification centre is planned for a later stage.</div>`; }
  if (id === "project-more") html = `<button role="menuitem" data-act="toast" data-msg="Edit details|Not part of this study.">${ic("edit")}Edit details</button><button role="menuitem" data-act="toast" data-msg="Duplicated|Prototype only.">${ic("copy")}Duplicate</button><div class="sep"></div><button role="menuitem" data-act="archive">${ic("archive")}Archive project…</button>`;
  m.innerHTML = html;
  m.classList.add("open");
  const app = $("#app").getBoundingClientRect();
  const b = btn.getBoundingClientRect();
  const w = m.offsetWidth;
  let left = b.right - app.left - w;
  if (left < 8) left = Math.min(b.left - app.left, app.width - w - 8);
  m.style.left = `${Math.max(8, left)}px`;
  m.style.top = `${b.bottom - app.top + 6}px`;
  btn.setAttribute("aria-expanded", "true");
  menuOwner = btn;
  const first = m.querySelector("button");
  first && first.focus();
}

/* quotation form */
function wireQuote() {
  const form = $("#quote-form");
  const upd = () => {
    const total = $$("input[data-line]", form).reduce((s, i) => s + (parseFloat(i.value.replace(/,/g, "")) || 0) * Number(i.dataset.qty), 0);
    $("#q-total").textContent = aed(Math.round(total));
  };
  form.addEventListener("input", (e) => {
    upd();
    const line = e.target.closest("input[data-line]");
    if (line && parseFloat(line.value.replace(/,/g, "")) > 0) line.closest(".inp-affix").style.borderColor = "";
  });
}

/* ---------------------------------------------------------------- events */
document.addEventListener("click", (e) => {
  const proto = e.target.closest("[data-proto-persona], [data-proto-frame], [data-proto-sim], [data-proto-system]");
  if (proto) {
    if (proto.dataset.protoPersona) { const k = PERSONAS[proto.dataset.protoPersona].kind; location.hash = `#/${proto.dataset.protoPersona}/${HOME[k]}`; }
    if (proto.dataset.protoFrame) { S.frame = proto.dataset.protoFrame; syncProto(); }
    if (proto.dataset.protoSim) { S.sim = proto.dataset.protoSim; render(); }
    if (proto.dataset.protoSystem !== undefined) location.hash = `#/${S.persona}/system`;
    return;
  }
  const el = e.target.closest("[data-act]");
  if (!el) {
    if (!e.target.closest("#menu")) closeMenu();
    if (e.target.id === "scrim") closeOverlays();
    return;
  }
  const act = el.dataset.act;
  if (act !== "menu") closeMenu();
  switch (act) {
    case "collapse": S.collapsed = !S.collapsed; $(".shell").classList.toggle("collapsed", S.collapsed); el.setAttribute("aria-pressed", S.collapsed); el.querySelector("span").textContent = S.collapsed ? "Expand" : "Collapse"; el.setAttribute("aria-label", `${S.collapsed ? "Expand" : "Collapse"} sidebar`); break;
    case "nav-open": S.navOpen = true; $(".shell").classList.add("nav-open"); $("#scrim").classList.add("on"); el.setAttribute("aria-expanded", "true"); S.lastFocus = el; $("#side a")?.focus(); break;
    case "menu": e.stopPropagation(); openMenu(el, el.dataset.menu); break;
    case "search": toast("Global search is planned", "The entry point is ready; search itself arrives in a later stage."); break;
    case "row": if (!e.target.closest("a, button") || e.target.closest("[data-act]") === el) location.hash = el.dataset.href; break;
    case "tab": { const base = el.dataset.base; location.hash = `${base}?tab=${el.dataset.tab}`; break; }
    case "chip": S.f[el.dataset.key] = el.dataset.val; refreshRegions(); break;
    case "sort": { const k = el.dataset.key, c = el.dataset.col, s = S.sort[k]; S.sort[k] = { col: c, dir: s && s.col === c && s.dir === "asc" ? "desc" : "asc" }; refreshRegions(); break; }
    case "clear-filters": Object.keys(S.f).forEach((k) => delete S.f[k]); $$("[data-filter]").forEach((i) => { i.value = ""; }); refreshRegions(); break;
    case "retry": S.sim = "normal"; render(); toast("Loaded", "The list is back."); break;
    case "close": closeOverlays(); break;
    case "toast": { const [t, s] = (el.dataset.msg || "").split("|"); toast(t, s); break; }
    case "invoice": invoiceDrawer(el.dataset.id); break;
    case "application": applicationDrawer(el.dataset.id); break;
    case "new-ticket": newTicketDrawer(); break;
    case "quote": quoteDrawer(el.dataset.id); break;
    case "approve-app": {
      const a = APPLICATIONS.find((x) => x.id === el.dataset.id);
      confirmModal({ icon: "mail", title: `Approve ${esc(a.company)}?`, body: `<p>This will:</p><ul><li>create an approved vendor profile for ${a.cats.map(esc).join(" and ")}</li><li>email a single-use invitation to <b>${esc(a.email)}</b>, valid for 7 days</li></ul><p class="mt8">No password is created or shown. The vendor sets their own.</p>`, confirm: "Approve and send invitation", onConfirm: () => { a.status = "Approved"; a.trade = a.trade; closeOverlays(); render(); toast(`Invitation sent to ${a.email}`, `${a.company} is now an approved vendor.`); } });
      break;
    }
    case "reject-app": {
      const a = APPLICATIONS.find((x) => x.id === el.dataset.id);
      confirmModal({ icon: "alert", tone: "warn", title: `Reject ${esc(a.company)}?`, body: `<p>${esc(a.contact)} will get an email saying the application wasn't approved. They can apply again later.</p>`, confirm: "Reject application", danger: true, onConfirm: () => { a.status = "Rejected"; closeOverlays(); render(); toast("Application rejected", "The applicant has been told."); } });
      break;
    }
    case "award": {
      const v = el.dataset.vendor, x = RFQS.find((y) => y.id === el.dataset.id);
      confirmModal({ icon: "star", title: `Award to ${esc(v)}?`, body: `<p>${esc(v)} gets a purchase order request. The other vendors are told they weren't selected. Their quotations stay on record.</p>`, confirm: "Award RFQ", onConfirm: () => { x.status = "Awarded"; x.awardedTo = v; delete COMPARE[x.id]; render(); toast(`Awarded to ${v}`, "Other vendors have been told."); } });
      break;
    }
    case "archive": {
      const p = PROJECTS.find((y) => y.id === ROUTE.id);
      confirmModal({ icon: "archive", tone: "warn", title: "Archive this project?", body: `<p>Archived projects leave active lists but keep their files, invoices and history. You can restore them later. Nothing is deleted.</p>`, confirm: "Archive project", onConfirm: () => { p.status = "Archived"; render(); toast("Project archived", "Find it under Status: Archived."); } });
      break;
    }
    case "demo-modal": confirmModal({ title: "Send the update to Acme?", body: "<p>Confirmations name the action, say what happens and use the same verb on the button.</p>", confirm: "Send update", onConfirm: () => toast("Update sent") }); break;
    case "leave": { const l = LEAVE.find((x) => x.id === el.dataset.id); l.status = el.dataset.val; render(); toast(`Leave ${el.dataset.val.toLowerCase()}`, `${l.who} has been told.`); break; }
    case "approve-doc": { $$("[data-act=approve-doc]").forEach((b) => { const wrap = b.parentElement; wrap.innerHTML = badge("Approved"); }); toast("Approved", "Rania will schedule checkout UAT."); break; }
    case "request-changes": newTicketDrawer(); setTimeout(() => { const t = $("#t-title"); if (t) t.value = "Changes to the checkout UAT plan"; const ty = $("#t-type"); if (ty) ty.value = "Change request"; }, 30); break;
    case "ticket-status": { const t = TICKETS.find((x) => x.id === el.dataset.id); t.status = el.dataset.val; t.updated = "Just now"; render(); toast(t.status === "Resolved" ? "Marked as resolved" : "Reopened", t.status === "Resolved" ? "You can reopen it any time." : "The team has been told."); break; }
    case "reply": { const ta = $("#reply"); if (!ta.value.trim()) { ta.focus(); toast("Write a reply first"); break; } const msg = document.createElement("div"); msg.className = `msg ${kind() === "client" ? "client" : "staff"}`; msg.innerHTML = `<span class="av">${esc(P().user.initials)}</span><div><div class="who"><b>${esc(P().user.name)}</b>Just now</div><div class="bubble">${esc(ta.value)}</div></div>`; ta.closest(".composer").before(msg); ta.value = ""; toast("Reply sent"); break; }
    case "submit-ticket": {
      const title = $("#t-title");
      if (!title.value.trim()) { title.classList.add("invalid"); title.setAttribute("aria-invalid", "true"); $("#t-title-err").hidden = false; title.focus(); break; }
      const id = `T-${2211 + TICKETS.length}`;
      TICKETS.unshift({ id, client: "acme", title: title.value.trim(), project: $("#t-proj").value.startsWith("Loyalty") ? "P-1039" : $("#t-proj").value.startsWith("E-") ? "P-1042" : null, priority: $("#t-pri").value.startsWith("High") ? "High" : $("#t-pri").value, status: "Open", opened: "Just now", updated: "Just now", assignee: "YS", msgs: 1 });
      closeOverlays();
      if (kind() === "client") go("support"); else render();
      toast(`Request ${id} sent`, "Youssef Sami's team will reply here.");
      break;
    }
    case "submit-quote": {
      const form = $("#quote-form");
      const lines = $$("input[data-line]", form);
      let ok = true;
      lines.forEach((i) => { const bad = !(parseFloat(i.value.replace(/,/g, "")) > 0); i.closest(".inp-affix").style.borderColor = bad ? "var(--bad)" : ""; if (bad) ok = false; });
      const conf = $("#q-confirm");
      if (!conf.checked) ok = false;
      $("#q-err").hidden = ok;
      if (!ok) { $("#q-err").scrollIntoView({ block: "nearest" }); (lines.find((i) => !(parseFloat(i.value) > 0)) || conf).focus(); break; }
      const total = Math.round(lines.reduce((s, i) => s + parseFloat(i.value.replace(/,/g, "")) * Number(i.dataset.qty), 0));
      const prev = MY_QUOTES.find((q) => q.rfq === el.dataset.id);
      if (prev) Object.assign(prev, { amount: total, submitted: "21 Oct 2026" });
      else MY_QUOTES.unshift({ rfq: el.dataset.id, amount: total, submitted: "21 Oct 2026", status: "Submitted", validity: $("#q-valid").value, delivery: `${$("#q-del").value || "—"} days` });
      closeOverlays(); render();
      toast("Quotation submitted", `${aed(total)} for ${el.dataset.id}. You can update it until the deadline.`);
      break;
    }
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if ($("#menu")?.classList.contains("open")) { const o = menuOwner; closeMenu(); o && o.focus(); } else closeOverlays(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-act=row], tr[data-act=invoice], tr[data-act=application], li[data-act]")) { e.preventDefault(); e.target.click(); }
  if (e.key === "/" && !e.target.matches("input, textarea, select")) { e.preventDefault(); $(".search")?.click(); }
  const d = $("#drawer");
  if (d && d.classList.contains("open") && !$("#modal-wrap").children.length) trapTab(e, d);
  const menu = $("#menu");
  if (menu?.classList.contains("open") && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    const items = $$("button", menu); const i = items.indexOf(document.activeElement);
    e.preventDefault(); items[(i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length]?.focus();
  }
});
document.addEventListener("input", (e) => {
  const f = e.target.closest("[data-filter]");
  if (f) { S.f[f.dataset.filter] = f.value; refreshRegions(); }
  if (e.target.id === "t-title" && e.target.value.trim()) { e.target.classList.remove("invalid"); e.target.removeAttribute("aria-invalid"); $("#t-title-err").hidden = true; }
});
document.addEventListener("change", (e) => {
  const f = e.target.closest("select[data-filter]");
  if (f) { S.f[f.dataset.filter] = f.value; refreshRegions(); }
});
window.addEventListener("hashchange", () => { closeMenu(); render(); const sc = $("#scroll"); if (sc) sc.scrollTop = 0; $("#main")?.focus({ preventScroll: true }); });

if (!location.hash) location.replace("#/manager/dashboard");
render();
})();
</script>
